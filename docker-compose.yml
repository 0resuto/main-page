services:
  website:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GITHUB_USERNAME: ${NEXT_PUBLIC_GITHUB_USERNAME:-0resuto}
        NEXT_PUBLIC_PHONE: ${NEXT_PUBLIC_PHONE:-}
        NEXT_PUBLIC_PHONE_LINK: ${NEXT_PUBLIC_PHONE_LINK:-}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
    container_name: main-page
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - ./frontend/.env
    environment:
      - ANALYTICS_API_URL=http://api:8000

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - "ANALYTICS_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-analytics_db}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: ${POSTGRES_DB:-analytics_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - main_page_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytics_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  main_page_postgres_data:
    name: main_page_postgres_data