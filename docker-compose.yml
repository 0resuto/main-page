services:
  website:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: main-page
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - ./frontend/.env

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics_db
    ports:
      - "5433:5432"
    volumes:
      - main_page_postgres_data:/var/lib/postgresql/data

volumes:
  main_page_postgres_data: